 <g transform="translate(435 215)"><circle r="25" fill="#1d4ed8" stroke="#93c5fd" stroke-width="4"/><text y="7" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">02</text><text x="0" y="70" text-anchor="middle" fill="#93c5fd" font-size="21" font-weight="700">Data practice</text><text x="0" y="98" text-anchor="middle" fill="#cbd5e1" font-size="16">Explore · clean · analyse</text><text x="0" y="121" text-anchor="middle" fill="#cbd5e1" font-size="16">communicate insight</text></g>
 <g transform="translate(735 215)"><circle r="25" fill="#6d28d9" stroke="#c4b5fd" stroke-width="4"/><text y="7" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">03</text><text x="0" y="70" text-anchor="middle" fill="#c4b5fd" font-size="21" font-weight="700">ML &amp; AI</text><text x="0" y="98" text-anchor="middle" fill="#cbd5e1" font-size="16">Experiment · evaluate</text><text x="0" y="121" text-anchor="middle" fill="#cbd5e1" font-size="16">build intelligent workflows</text></g>
 <g transform="translate(1035 215)"><circle r="25" fill="#b45309" stroke="#fcd34d" stroke-width="4"/><text y="7" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">04</text><text x="0" y="70" text-anchor="middle" fill="#fcd34d" font-size="21" font-weight="700">Product engineering</text><text x="0" y="98" text-anchor="middle" fill="#cbd5e1" font-size="16">APIs · interfaces · data</text><text x="0" y="121" text-anchor="middle" fill="#cbd5e1" font-size="16">end-to-end systems</text></g>
 <g transform="translate(1365 190)"><circle r="27" fill="#166534" stroke="#86efac" stroke-width="4"/><path d="M-9 0 L-2 8 L12 -10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="-5" y="92" text-anchor="end" fill="#86efac" font-size="21" font-weight="700">Next</text><text x="-5" y="119" text-anchor="end" fill="#cbd5e1" font-size="16">Scale with evidence</text></g>
