<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="540" viewBox="0 0 1500 540" role="img" aria-labelledby="title desc">
<title id="title">Capability map — connected disciplines</title><desc id="desc">Five connected disciplines support practical real-world software products.</desc>
