name: Refresh GitHub profile metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-profile-metrics.yml"
      - "scripts/generate-profile-metrics.mjs"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-profile-metrics.yml"
      - "scripts/generate-profile-metrics.mjs"

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check generator syntax
        run: node --check scripts/generate-profile-metrics.mjs

      - name: Check whitespace errors
        run: git diff --check

  refresh:
    if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate GitHub metrics SVGs
        run: node scripts/generate-profile-metrics.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit refreshed charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/github-languages.svg assets/github-activity.svg
          if git diff --cached --quiet; then
            echo "Profile metrics have not changed."
            exit 0
          fi
          git commit -m "chore: refresh GitHub profile metrics"
          git push
