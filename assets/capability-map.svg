<text x="62" y="70" fill="#93c5fd" font-family="Arial" font-size="17" font-weight="700" letter-spacing="4">CONNECTED CAPABILITIES</text>
<text x="62" y="116" fill="#f8fafc" font-family="Arial" font-size="32" font-weight="700">Different disciplines. One goal: useful systems.</text>
