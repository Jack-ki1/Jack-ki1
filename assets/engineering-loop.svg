<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
<title id="title">Engineering approach — from problem to measurable product</title><desc id="desc">Six connected stages show a practical engineering workflow with an iteration loop.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08172d"/><stop offset="1" stop-color="#121b3a"/></linearGradient><linearGradient id="line" x2="1"><stop stop-color="#22d3ee"/><stop offset=".52" stop-color="#8b5cf6"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs>
<rect width="1500" height="500" rx="26" fill="url(#bg)"/>
<text x="65" y="72" fill="#93c5fd" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4">THE WAY I BUILD</text>
<text x="65" y="120" fill="#f8fafc" font-family="Arial" font-size="33" font-weight="700">A practical loop from problem to product</text>
<path d="M170 258 H1325" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>
<g font-family="Arial" text-anchor="middle">
 <g transform="translate(70 175)"><rect width="195" height="166" rx="18" fill="#10294a" stroke="#22d3ee" stroke-width="2"/><circle cx="28" cy="28" r="17" fill="#0891b2"/><text x="28" y="34" fill="#fff" font-size="16" font-weight="700">01</text><text x="97" y="80" fill="#67e8f9" font-size="21" font-weight="700">Frame</text><text x="97" y="111" fill="#e2e8f0" font-size="15">Define the user,</text><text x="97" y="133" fill="#e2e8f0" font-size="15">need and constraints</text></g>
 <g transform="translate(305 175)"><rect width="195" height="166" rx="18" fill="#172548" stroke="#38bdf8" stroke-width="2"/><circle cx="28" cy="28" r="17" fill="#2563eb"/><text x="28" y="34" fill="#fff" font-size="16" font-weight="700">02</text><text x="97" y="80" fill="#7dd3fc" font-size="21" font-weight="700">Explore</text><text x="97" y="111" fill="#e2e8f0" font-size="15">Inspect data,</text><text x="97" y="133" fill="#e2e8f0" font-size="15">sources and quality</text></g>
 <g transform="translate(540 175)"><rect width="195" height="166" rx="18" fill="#211d48" stroke="#a78bfa" stroke-width="2"/><circle cx="28" cy="28" r="17" fill="#7c3aed"/><text x="28" y="34" fill="#fff" font-size="16" font-weight="700">03</text><text x="97" y="80" fill="#c4b5fd" font-size="21" font-weight="700">Baseline</text><text x="97" y="111" fill="#e2e8f0" font-size="15">Start simple;</text><text x="97" y="133" fill="#e2e8f0" font-size="15">set a fair benchmark</text></g>
 <g transform="translate(775 175)"><rect width="195" height="166" rx="18" fill="#282044" stroke="#c084fc" stroke-width="2"/><circle cx="28" cy="28" r="17" fill="#9333ea"/><text x="28" y="34" fill="#fff" font-size="16" font-weight="700">04</text><text x="97" y="80" fill="#d8b4fe" font-size="21" font-weight="700">Build</text><text x="97" y="111" fill="#e2e8f0" font-size="15">Model, API, UX</text><text x="97" y="133" fill="#e2e8f0" font-size="15">and integration</text></g>
 <g transform="translate(1010 175)"><rect width="195" height="166" rx="18" fill="#123047" stroke="#2dd4bf" stroke-width="2"/><circle cx="28" cy="28" r="17" fill="#0f766e"/><text x="28" y="34" fill="#fff" font-size="16" font-weight="700">05</text><text x="97" y="80" fill="#5eead4" font-size="21" font-weight="700">Validate</text><text x="97" y="111" fill="#e2e8f0" font-size="15">Test, measure,</text><text x="97" y="133" fill="#e2e8f0" font-size="15">surface limitations</text></g>
 <g transform="translate(1245 175)"><rect width="195" height="166" rx="18" fill="#123528" stroke="#4ade80" stroke-width="2"/><circle cx="28" cy="28" r="17" fill="#15803d"/><text x="28" y="34" fill="#fff" font-size="16" font-weight="700">06</text><text x="97" y="80" fill="#86efac" font-size="21" font-weight="700">Improve</text><text x="97" y="111" fill="#e2e8f0" font-size="15">Ship, learn and</text><text x="97" y="133" fill="#e2e8f0" font-size="15">iterate from evidence</text></g>
</g>
<path d="M1340 365 C1340 445 175 445 175 365" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 9"/><path d="M164 379 L175 359 L186 379" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="750" y="423" text-anchor="middle" fill="#a5b4fc" font-family="Arial" font-size="17" font-weight="700">CONTINUOUS FEEDBACK LOOP</text>
<text x="750" y="465" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="17">Use the simplest method that works. Add complexity only when evidence justifies it.</text>
</svg>