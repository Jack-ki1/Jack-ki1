<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="390" viewBox="0 0 1600 390" role="img" aria-labelledby="title desc">
<title id="title">Jackson Kimotho — Data, AI and Software Engineering</title><desc id="desc">A dark, colorful technical banner with connected data nodes, a code window, charts and a glowing abstract African continent.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071427"/><stop offset=".55" stop-color="#0c1c3b"/><stop offset="1" stop-color="#101431"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
 <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bef264"/><stop offset="1" stop-color="#10b981"/></linearGradient>
 <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fb923c"/><stop offset="1" stop-color="#facc15"/></linearGradient>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#8ca5d8" stroke-opacity=".09" stroke-width="1"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="390" rx="28" fill="url(#bg)"/><rect width="1600" height="390" rx="28" fill="url(#grid)"/>
<circle cx="1410" cy="70" r="245" fill="#2563eb" opacity=".10"/><circle cx="1250" cy="360" r="270" fill="#06b6d4" opacity=".07"/>
<path d="M0 330 C320 270 475 420 780 320 S1260 250 1600 320" fill="none" stroke="#22d3ee" stroke-opacity=".13" stroke-width="2"/>
<rect x="58" y="48" width="7" height="285" rx="4" fill="url(#cyan)"/>
<text x="100" y="112" fill="#93c5fd" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" letter-spacing="5">ENGINEERING WITH PURPOSE</text>
<text x="96" y="183" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="800" letter-spacing="-2">JACKSON KIMOTHO</text>
<text x="100" y="229" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="25">Data Scientist  <tspan fill="#22d3ee">•</tspan>  AI / ML Engineer  <tspan fill="#a78bfa">•</tspan>  Software Developer</text>
<text x="100" y="277" fill="#e2e8f0" font-family="Arial,Helvetica,sans-serif" font-size="21">Turning data, models and code into useful real-world systems.</text>
<g font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700">
 <rect x="100" y="303" width="114" height="35" rx="17" fill="#0e7490" fill-opacity=".27" stroke="#22d3ee" stroke-opacity=".7"/><text x="157" y="326" text-anchor="middle" fill="#a5f3fc">DATA SCIENCE</text>
 <rect x="226" y="303" width="103" height="35" rx="17" fill="#5b21b6" fill-opacity=".27" stroke="#a78bfa" stroke-opacity=".75"/><text x="277" y="326" text-anchor="middle" fill="#ddd6fe">APPLIED AI</text>
 <rect x="341" y="303" width="157" height="35" rx="17" fill="#047857" fill-opacity=".25" stroke="#34d399" stroke-opacity=".75"/><text x="419" y="326" text-anchor="middle" fill="#a7f3d0">PRODUCT ENGINEERING</text>
</g>
<g transform="translate(760 72)">
 <rect width="390" height="236" rx="18" fill="#0b1730" stroke="#36527f" stroke-width="2"/>
 <rect x="0" y="0" width="390" height="39" rx="18" fill="#172b4e"/><path d="M0 22V39H390V22" fill="#172b4e"/>
 <circle cx="23" cy="20" r="5" fill="#fb7185"/><circle cx="42" cy="20" r="5" fill="#fbbf24"/><circle cx="61" cy="20" r="5" fill="#34d399"/>
 <text x="86" y="25" font-family="monospace" font-size="13" fill="#9fb5d9">build_impact.py</text>
 <g font-family="monospace" font-size="16">
  <text x="28" y="78" fill="#a78bfa">def</text><text x="69" y="78" fill="#67e8f9"> build_solution</text><text x="218" y="78" fill="#e2e8f0">(problem):</text>
  <text x="48" y="111" fill="#94a3b8">data =</text><text x="115" y="111" fill="#86efac"> understand(problem)</text>
  <text x="48" y="144" fill="#94a3b8">model =</text><text x="126" y="144" fill="#fcd34d"> learn_from(data)</text>
  <text x="48" y="177" fill="#94a3b8">product =</text><text x="142" y="177" fill="#67e8f9"> ship(model)</text>
  <text x="48" y="210" fill="#a78bfa">return</text><text x="115" y="210" fill="#86efac"> measure(product)</text>
 </g>
</g>
<g transform="translate(1195 70)">
 <path d="M10 85 L70 34 L130 74 L190 20 L250 61 L310 22" fill="none" stroke="url(#cyan)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
 <g fill="#22d3ee"><circle cx="10" cy="85" r="6"/><circle cx="70" cy="34" r="6"/><circle cx="130" cy="74" r="6"/><circle cx="190" cy="20" r="6"/><circle cx="250" cy="61" r="6"/><circle cx="310" cy="22" r="6"/></g>
 <path d="M10 220H320" stroke="#334155" stroke-width="2"/>
 <g transform="translate(25 132)"><rect x="0" y="44" width="28" height="44" rx="5" fill="#2563eb"/><rect x="44" y="24" width="28" height="64" rx="5" fill="#06b6d4"/><rect x="88" y="4" width="28" height="84" rx="5" fill="#8b5cf6"/><rect x="132" y="34" width="28" height="54" rx="5" fill="#10b981"/><rect x="176" y="0" width="28" height="88" rx="5" fill="#f59e0b"/><rect x="220" y="16" width="28" height="72" rx="5" fill="#3b82f6"/></g>
 <text x="160" y="250" text-anchor="middle" fill="#9fb5d9" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="3">DATA  →  INSIGHT  →  IMPACT</text>
</g>
<rect x="1" y="1" width="1598" height="388" rx="27" fill="none" stroke="#4f76b4" stroke-opacity=".45" stroke-width="2"/>
