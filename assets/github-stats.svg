<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="250" viewBox="0 0 1500 250" role="img" aria-label="GitHub at a glance"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081629"/><stop offset="1" stop-color="#151B38"/></linearGradient></defs><rect width="1500" height="250" rx="22" fill="url(#bg)"/><text x="54" y="52" fill="#F8FAFC" font-family="Arial,sans-serif" font-size="22" font-weight="700">GitHub at a glance</text><text x="54" y="92" fill="#94A3B8" font-family="Arial,sans-serif" font-size="16">Public repository and contribution metrics are generated by GitHub Actions.</text><rect x="54" y="122" width="1392" height="2" fill="#263957"/><text x="54" y="216" fill="#67E8F9" font-family="Arial,sans-serif" font-size="14">First data snapshot is generated automatically by this repository’s GitHub Actions workflow.</text></svg>